INVOICE:
  PREFIX: "&8[&aBillify&8] &7"
  DATE_FORMAT: "dd-MM-yyyy hh:mm a"
  DAYS_LEFT_SUFFIX: " (%days% days left)"
  MENU:
    SECTIONS:
      INVOICE: "&aInvoice"
      OPEN: "&aOpen"
      PAID: "&aPaid"
    # Header of the invoice menu when the player has the Billify resource pack.
    # Placeholders: %section%, %player%, %page%, %pages%
    PACK_HEADER: "Invoices | %section%"
    PACK_HEADER_OTHER: "%player% | %section%"
  BUTTONS:
    INVOICE:
      TITLE: "&aInvoice #%invoice_id%"
      LORE:
        - ""
        - "&aReceived from: &7%sender%"
        - "&aStatus: &7%status%"
        - "&aPrice: &7$%price%"
        - ""
        - "&aDescription: &7%reason%"
        - ""
      WHEN_PAID:
        - "&aPaid on: &7%date%"
        - "&aPaid by: &7%paidBy%"
      WHEN_AUTO_PAID:
        - "&aAuto paid on: &7%date%"
      WHEN_CANCELLED:
        - "&aCancelled on: &7%date%"
        - "&aCancelled by: &7%canceledBy%"
        - "&aCancel reason: &7%reason%"
      WHEN_NOT_PAID_YET:
        - "&aPay before: &7%dateToPay%"
    BALANCE:
      TITLE: "&6Your Balance"
      LORE:
        - ""
        - "&aBalance of &7%player%&a:"
        - "&6%balance%"
        - ""
    PAY:
      TITLE: "&a&lPay invoice #%invoice_id%"
      LORE:
        - ""
        - "&7Amount: &f%amount%"
        - "&7Description: &f%reason%"
        - ""
        - "&aClick to pay"
    BACK: "&7Back to your invoices"
    PREVIOUS_PAGE: "&aPrevious Page"
    NEXT_PAGE: "&aNext Page"
    CLOSE: "&cClose Menu"
    OPEN_INVOICES: "&aOpen Invoices"
    PAID_INVOICES: "&aPaid Invoices"
  # The receipt you see after clicking an invoice.
  RECEIPT:
    TITLE: "&8&l» &aInvoice #%invoice_id%" # Menu title without the resource pack.
    # Everything below is drawn on the paper receipt of the resource pack.
    # Keep texts short: they are cut off with ".." when they don't fit.
    HEADER: "Invoice #%invoice_id%"
    HEADING: "INVOICE"
    NUMBER: "#%invoice_number%" # %invoice_number% is the id padded to 4 digits (0012)
    DAYS_LEFT: "%days% days left"
    DUE_TODAY: "due today"
    DAYS_LATE: "%days% days late"
    FROM: "From"
    TO: "To"
    DATE: "Date"
    DUE: "Due"
    FEE: "+%percent%% collection fee"
    TOTAL: "TOTAL"
    DATE_FORMAT: "dd-MM-yyyy"
    SHORT_DATE_FORMAT: "dd-MM-yy" # Used in the narrow side panel.
    TIME_FORMAT: "HH:mm"
    PANEL:
      PAY: "Pay"
      BACK: "Back"
      BALANCE: "Balance"
      PAID_ON: "Paid on"
      PAID_BY: "Paid by"
      COLLECTED: "Collected"
      COLLECTED_SUB: "auto"
      ON: "on"
      CANCELLED: "Cancelled"
      BY: "by"
    # Colours: & codes or hex (&#rrggbb, 1.16+).
    COLORS:
      HEADER: "&f"
      TEXT: "&#3a2f22"
      LABEL: "&#7a6e5c"
      DAYS_LEFT: "&#e68c28"
      DAYS_LATE: "&#c8322d"
      FEE: "&#c8322d"
      PAY: "&f"
      BACK: "&f"
      BALANCE: "&e"
      PANEL_TEXT: "&f"
      PANEL_ACCENT: "&a"
      PANEL_WARNING: "&c"
      PANEL_MUTED: "&7"
  DEBT_COLLECTION:
    REMINDER:
      - ""
      - "&8[%agency%&8] &cYou still have an outstanding invoice!"
      - "&7Invoice &f#%invoice_id% &7of &f%amount% &7is &c%days_overdue% day(s) &7overdue."
      - "&7Pay it with &f/invoice &7before it is collected automatically!"
      - ""
    FEE_APPLIED: "&8[%agency%&8] &cA collection fee has been added to invoice #%invoice_id%. New amount: &f%amount%"
    AUTO_COLLECTED: "&8[%agency%&8] &cInvoice #%invoice_id% (%amount%) has been collected from your balance automatically."
  CHECK:
    CANNOT_PAY_OTHERS_INVOICE: "&fYou cannot pay an invoice that isn't yours!"
    INVOICE_NOT_FOUND: "&fThis player has no invoices!"
    INVOICE_ALREADY_PAID: "&fThis invoice has already been paid!"
    NOT_ENOUGH_MONEY: "&fYou don't have enough money to pay this invoice!"
    INVOICE_PAID: "&fYou have paid invoice #%invoice_id%!"
    INVOICE_AUTO_PAID: "&fYour invoice #%invoice_id% has been auto-paid!"
    OPEN_INVOICE_NOTIFY: "&fYou have %amount% open invoice(s)! View them with %command%"
    NO_PERMISSION_TO_OPEN_INVOICE_MENU: "&fYou don't have permission to open the invoice menu!"
  COMMANDS:
    HELP_COMMAND:
      DESCRIPTION: "&8&l» &f/invoice &8-> &7Open the invoice menu"
      COMMAND_LIST:
        - "&f/invoice &8-> &7Open the invoice menu"
        - "&f/invoice create <player> <amount> <reason> &8-> &7Create an invoice"
        - "&f/invoice view <player> &8-> &7View a player's invoice"
        - "&f/invoice cancel <player> <id> <reason> &8-> &7Cancel an invoice"
    CREATE_COMMAND:
      DESCRIPTION: "&8&l» &f/invoice create <player> <amount> <reason> &8-> &7Create an invoice"
      NO_PERMISSION: "&8&l» &fYou don't have permission to execute this command!"
      NO_PERMISSION_TO_SEND: "&8&l» &fYou don't have permission to send invoices!"
      PLAYER_ONLY: "&8&l» &fYou must be a player to execute this command!"
      INVALID_PLAYER: "&8&l» &fThis player doesn't exist!"
      INVALID_AMOUNT: "&8&l» &fInvalid amount!"
      INVALID_INPUT: "&8&l» &fInvalid input! Usage: /invoice create <player> <amount> <reason>"
      NEGATIVE_AMOUNT: "&8&l» &fThe amount must be greater than 0!"
      LIMIT_EXCEEDED: "&8&l» &fYou have reached the limit of %limit%!"
      REASON_TOO_LONG: "&8&l» &fThe reason cannot be longer than 32 characters!"
      INVOICE_SENT: "&8&l» &fYou have sent an invoice to %player_name%!"
      INVOICE_RECEIVED: "&8&l» &fYou have received an invoice! View it with /invoice"
    FORCECREATE_COMMAND:
      DESCRIPTION: "&8&l» &f/invoice forcecreate <player> <amount> <reason> &8-> &7Force create an invoice"
      NO_PERMISSION: "&8&l» &fYou don't have permission to execute this command!"
      PLAYER_ONLY: "&8&l» &fYou must be a player to execute this command!"
      INVALID_PLAYER: "&8&l» &fThis player doesn't exist!"
      INVALID_AMOUNT: "&8&l» &fInvalid amount!"
      NEGATIVE_AMOUNT: "&8&l» &fThe amount must be greater than 0!"
      LIMIT_EXCEEDED: "&8&l» &fYou have reached the limit of %limit%!"
      REASON_TOO_LONG: "&8&l» &fThe reason cannot be longer than 32 characters!"
      INVOICE_SENT: "&8&l» &fYou have sent an invoice to %player_name%!"
      INVOICE_RECEIVED: "&8&l» &fYou have received an invoice! View it with /invoice"
    VIEW_COMMAND:
      DESCRIPTION: "&8&l» &f/invoice view <player> &8-> &7View a player's invoice"
      NO_PERMISSION: "&8&l» &fYou don't have permission to execute this command!"
      NO_PERMISSION_TO_SEND: "&8&l» &fYou don't have permission to view other players' invoices!"
      PLAYER_ONLY: "&8&l» &fYou must be a player to execute this command!"
      INVALID_PLAYER: "&8&l» &fThis player doesn't exist!"
    CANCEL_COMMAND:
      DESCRIPTION: "&8&l» &f/invoice cancel <player> <id> <reason> &8-> &7Cancel an invoice"
      NO_PERMISSION: "&8&l» &fYou don't have permission to execute this command!"
      NO_PERMISSION_TO_SEND: "&8&l» &fYou don't have permission to cancel invoices!"
      PLAYER_ONLY: "&8&l» &fYou must be a player to execute this command!"
      INVALID_PLAYER: "&8&l» &fThis player doesn't exist!"
      INVALID_INVOICE_ID: "&8&l» &fInvalid Invoice ID!"
      REASON_TOO_LONG: "&8&l» &fThe reason cannot be longer than 32 characters!"
      INVOICE_CANCELLED: "&8&l» &fYou have cancelled the invoice for %player_name% (ID: %invoice_id%)!"
    COMMAND_LIST_HEADER: "\n&8&l» &fInvoice commands:"
